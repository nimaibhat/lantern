# XcodeGen spec for the Lantern phone app (Scan and Tag tabs). Generate the project with:
#   cd ios && xcodegen
# then open ios/Lantern.xcodeproj. The .xcodeproj is generated, so it is not committed.
# Set your Team under Signing & Capabilities after each regenerate (or put it in DEVELOPMENT_TEAM below).

name: Lantern
options:
  bundleIdPrefix: com.nimaibhat
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortraitUpsideDown"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  LanternScan:
    type: application
    platform: iOS
    sources:
      - path: LanternScan
        excludes: [Info.plist]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nimaibhat.lanternscan
        INFOPLIST_KEY_CFBundleDisplayName: Lantern
        # Info.plist holds only what build settings cannot express (plain http to the dev server).
        INFOPLIST_FILE: LanternScan/Info.plist
        INFOPLIST_KEY_NSCameraUsageDescription: Lantern uses the camera to measure your rooms.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Lantern connects to the Lantern website on your network.
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: Lantern uses Bluetooth to broadcast a signal so nearby receivers can determine room location.
